# Learn more about configuring your app at https://shopify.dev/docs/apps/tools/cli/configuration

client_id = "de1d7a5b81576a9436521ad0bfc23320"
name = "Geekify: Upsell Progress Bar"
application_url = "https://example.com"
embedded = true

[build]
automatically_update_urls_on_dev = true
include_config_on_deploy = true
dev_store_url = "geekify-app.myshopify.com"

[webhooks]
api_version = "2026-07"

  [[webhooks.subscriptions]]
  topics = [ "app/uninstalled" ]
  uri = "/webhooks/app/uninstalled"

  [[webhooks.subscriptions]]
  topics = [ "app/scopes_update" ]
  uri = "/webhooks/app/scopes_update"

[access_scopes]
# Learn more at https://shopify.dev/docs/apps/tools/cli/configuration#access_scopes
scopes = "write_app_proxy,read_customers,read_discounts,read_price_rules,read_shipping,write_cart_transforms,write_customers,write_discounts,write_metaobject_definitions,write_metaobjects,write_price_rules,write_products,write_shipping"

# Storefront https://{shop}/apps/sce/<path> → your app at /apps/sce/<path>
[app_proxy]
url = "/apps/sce"
prefix = "apps"
subpath = "sce"

# Storefront embed reads this when app proxy is unavailable (public JSON).
[shop.metafields.app.storefront_config]
type = "json"
name = "SCE storefront config"
description = "Tier progress bar and widget settings for the theme embed"
access.admin = "merchant_read_write"
access.storefront = "public_read"

[auth]
redirect_urls = [ "https://example.com/api/auth" ]
