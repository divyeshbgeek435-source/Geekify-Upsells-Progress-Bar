# Learn more about configuring your app at https://shopify.dev/docs/apps/tools/cli/configuration

client_id = "de1d7a5b81576a9436521ad0bfc23320"
name = "Geekify: Upsell Progress Bar"
application_url = "https://example.com"
embedded = true

[webhooks]
api_version = "2026-07"

  [[webhooks.subscriptions]]
  uri = "/webhooks/app/scopes_update"
  topics = [ "app/scopes_update" ]

  [[webhooks.subscriptions]]
  uri = "/webhooks/app/uninstalled"
  topics = [ "app/uninstalled" ]

[shop.metafields.app.storefront_config]
type = "json"
name = "SCE storefront config"
description = "Tier progress bar and widget settings for the theme embed"

  [shop.metafields.app.storefront_config.access]
  admin = "merchant_read_write"
  storefront = "public_read"

[app_proxy]
url = "https://example.com/apps/sce"
subpath = "sce"
prefix = "apps"

[access_scopes]
# Learn more at https://shopify.dev/docs/apps/tools/cli/configuration#access_scopes
scopes = "read_customers,read_discounts,read_price_rules,read_shipping,write_app_proxy,write_cart_transforms,write_customers,write_discounts,write_metaobject_definitions,write_metaobjects,write_price_rules,write_products,write_shipping"

[auth]
redirect_urls = [ "https://example.com/api/auth" ]

[build]
automatically_update_urls_on_dev = true
